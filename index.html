<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hours Worked Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f4f4f4;
      padding: 20px;
      margin: 0;
    }

    .calculator {
      background: white;
      padding: 20px;
      border-radius: 14px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .time-row {
      display: flex;
      gap: 10px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .result {
      margin-top: 24px;
      padding: 16px;
      background: #f0f0f0;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
    }

    @media (min-width: 600px) {
      body {
        padding: 40px;
      }
    }
  </style>
</head>

<body>
  <div class="calculator">
    <h1>Hours Worked Calculator</h1>

    <div class="field">
      <label>Start Time</label>
      <div class="time-row">
        <input id="startTime" placeholder="7.50" type="number" step="0.25" />
        <select id="startPeriod">
          <option value="AM" selected>AM</option>
          <option value="PM">PM</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>End Time</label>
      <div class="time-row">
        <input id="endTime" placeholder="6.00" type="number" step="0.25" />
        <select id="endPeriod">
          <option value="AM">AM</option>
          <option value="PM" selected>PM</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Break Time (hours)</label>
      <input id="breakTime" type="number" step="0.25" value="1" />
    </div>

    <div class="result">
      Total Hours Worked:
      <div id="output">—</div>
    </div>
  </div>

  <script>
    const inputs = document.querySelectorAll("input, select");

    function to24Hour(time, period) {
      if (period === "PM" && time < 12) return time + 12;
      if (period === "AM" && time === 12) return 0;
      return time;
    }

    function calculateHours() {
      const startTime = parseFloat(document.getElementById("startTime").value);
      const endTime = parseFloat(document.getElementById("endTime").value);
      const breakTime = parseFloat(document.getElementById("breakTime").value) || 0;

      const startPeriod = document.getElementById("startPeriod").value;
      const endPeriod = document.getElementById("endPeriod").value;

      if (isNaN(startTime) || isNaN(endTime)) {
        document.getElementById("output").textContent = "—";
        return;
      }

      const start = to24Hour(startTime, startPeriod);
      const end = to24Hour(endTime, endPeriod);

      let total = end - start - breakTime;

      if (total < 0) total = 0;

      document.getElementById("output").textContent = total.toFixed(2);
    }

    inputs.forEach(input => input.addEventListener("input", calculateHours));
  </script>
</body>
</html>
