<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hours Worked Calculator</title>

  <style>
    /* ---- BASE STYLING ---- */
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a1a;
      padding: 20px;
      color: #eee;
    }

    .card {
      max-width: 420px;
      margin: auto;
      background: #333333; 
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #fff;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      color: #fff; /* same as title */
    }

    /* ---- FORM ROWS ---- */
    .time-row {
      display: flex;
      gap: 8px;
    }

    .time-input {
      flex: 1;
      color: #fff;
      background: #444;
    }

    .period {
      width: 80px;
      background-color: #444;
      color: #fff;
      -webkit-appearance: auto;
      -moz-appearance: auto;
      appearance: auto;
    }

    .break-row {
      display: flex;
    }

    .break-input {
      flex: 1;
      margin-right: 88px;
      color: #fff;
      background: #444;
    }

    /* ---- INPUT STYLING ---- */
    input, select {
      padding: 14px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #555;
      width: 100%;
      box-sizing: border-box;
      font-weight: 500;
      transition: border-color 0.2s ease;
    }

    input::placeholder {
      color: #ccc; /* lighter placeholder */
    }

    input:focus, select:focus {
      border-color: #f68b43; /* only orange outline */
      outline: none;
      box-shadow: none;
      background: #444; /* keep same background */
    }

    select {
      background: #444;
      color: #fff;
    }

    /* ---- RESULT BOX ---- */
    .result {
      margin-top: 24px;
      background: #222;
      padding: 16px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      color: #eee;
    }

    .result #output {
      display: block;
      font-size: 32px;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Hours Worked Calculator</h1>

    <!-- START TIME -->
    <label>Start Time</label>
    <div class="time-row">
      <input id="startTime" class="time-input" placeholder="9:30" inputmode="numeric" />
      <select id="startPeriod" class="period">
        <option>AM</option>
        <option>PM</option>
      </select>
    </div>

    <!-- END TIME -->
    <label>End Time</label>
    <div class="time-row">
      <input id="endTime" class="time-input" placeholder="6:30" inputmode="numeric" />
      <select id="endPeriod" class="period">
        <option>PM</option>
        <option>AM</option>
      </select>
    </div>

    <!-- BREAK TIME -->
    <label>Break Time (hours)</label>
    <div class="break-row">
      <input
        id="breakTime"
        class="break-input"
        type="number"
        step="0.25"
        value="1"
      />
    </div>

    <!-- RESULT -->
    <div class="result">
      Total Hours Worked: <span id="output">—</span>
    </div>
  </div>

  <script>
    function formatTimeInput(input) {
      let digits = input.value.replace(/\D/g, "");

      if (digits.length === 3) {
        digits = digits[0] + "30";
      }

      if (digits.length >= 4) {
        digits = digits.slice(0, 4);
        input.value = digits.slice(0, 2) + ":" + digits.slice(2);
      } else if (digits.length >= 2) {
        input.value = digits[0] + ":" + digits.slice(1);
      } else {
        input.value = digits;
      }
    }

    function parseTime(timeStr, period) {
      if (!timeStr.includes(":")) return null;

      let [h, m] = timeStr.split(":").map(Number);

      if (h < 1 || h > 12 || ![0, 15, 30, 45].includes(m)) {
        return null;
      }

      if (h === 12) h = 0;
      if (period === "PM") h += 12;

      return h + m / 60;
    }

    function calculate() {
      const start = parseTime(startTime.value, startPeriod.value);
      const end = parseTime(endTime.value, endPeriod.value);
      const breakTime = parseFloat(breakTimeInput.value);

      if (start === null || end === null || isNaN(breakTime)) {
        output.textContent = "—";
        return;
      }

      let worked = end - start - breakTime;
      if (worked < 0) worked += 24;

      output.textContent = worked.toFixed(2);
    }

    const startTime = document.getElementById("startTime");
    const endTime = document.getElementById("endTime");
    const startPeriod = document.getElementById("startPeriod");
    const endPeriod = document.getElementById("endPeriod");
    const breakTimeInput = document.getElementById("breakTime");
    const output = document.getElementById("output");

    startTime.addEventListener("input", () => {
      formatTimeInput(startTime);
      calculate();
    });

    endTime.addEventListener("input", () => {
      formatTimeInput(endTime);
      calculate();
    });

    document.querySelectorAll("select, #breakTime").forEach(el => {
      el.addEventListener("input", calculate);
    });
  </script>
</body>
</html>
