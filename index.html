<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hours Worked Calculator</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a1a;
      padding: 20px;
      color: #eee;
    }

    .card {
      max-width: 420px;
      margin: auto;
      background: #333333;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
      color: #fff;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      color: #fff;
    }

    .time-row {
      display: flex;
      gap: 8px;
    }

    .break-row {
      display: flex;
    }

    input, select {
      padding: 14px;
      font-size: 17px;
      border-radius: 8px;
      border: 1px solid #555;
      width: 100%;
      box-sizing: border-box;
      font-weight: 500;
      background: #444;
      color: #fff;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus {
      border-color: #f68b43;
      outline: none;
      background: #444;
    }

    .time-input {
      flex: 1;
    }

    .period {
      width: 80px;
    }

    .break-input {
      flex: 1;
      margin-right: 88px;
    }

    .result {
      margin-top: 24px;
      background: #222;
      padding: 16px;
      border-radius: 12px;
      font-size: 19px;
      font-weight: 600;
      text-align: center;
      color: #eee;
    }

    .result #output {
      display: block;
      font-size: 34px;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Hours Worked Calculator</h1>

    <label>Start Time</label>
    <div class="time-row">
      <input id="startTime" class="time-input" inputmode="numeric" />
      <select id="startPeriod" class="period">
        <option>AM</option>
        <option>PM</option>
      </select>
    </div>

    <label>End Time</label>
    <div class="time-row">
      <input id="endTime" class="time-input" inputmode="numeric" />
      <select id="endPeriod" class="period">
        <option>PM</option>
        <option>AM</option>
      </select>
    </div>

    <label>Break Time (hours)</label>
    <div class="break-row">
      <input
        id="breakTime"
        class="break-input"
        type="number"
        step="0.25"
        value="1"
      />
    </div>

    <div class="result">
      Total Hours Worked
      <span id="output">—</span>
    </div>
  </div>

  <script>
    function normalizeTime(input) {
      let digits = input.value.replace(/\D/g, "");

      if (digits.length === 3) {
        input.value = digits[0] + ":" + digits.slice(1);
      } else if (digits.length === 4) {
        input.value = digits.slice(0, 2) + ":" + digits.slice(2);
      }
    }

    function parseTime(timeStr, period) {
      if (!timeStr.includes(":")) return null;

      let [h, m] = timeStr.split(":").map(Number);

      if (
        isNaN(h) || isNaN(m) ||
        h < 1 || h > 12 ||
        m < 0 || m > 59
      ) return null;

      if (h === 12) h = 0;
      if (period === "PM") h += 12;

      return h + m / 60;
    }

    function calculate() {
      const start = parseTime(startTime.value, startPeriod.value);
      const end = parseTime(endTime.value, endPeriod.value);
      const breakTime = parseFloat(breakTimeInput.value);

      if (start === null || end === null || isNaN(breakTime)) {
        output.textContent = "—";
        return;
      }

      let worked = end - start - breakTime;
      if (worked < 0) worked += 24;

      output.textContent = worked.toFixed(2);
    }

    const startTime = document.getElementById("startTime");
    const endTime = document.getElementById("endTime");
    const startPeriod = document.getElementById("startPeriod");
    const endPeriod = document.getElementById("endPeriod");
    const breakTimeInput = document.getElementById("breakTime");
    const output = document.getElementById("output");

    startTime.addEventListener("blur", () => {
      normalizeTime(startTime);
      calculate();
    });

    endTime.addEventListener("blur", () => {
      normalizeTime(endTime);
      calculate();
    });

    document.querySelectorAll("select, #breakTime").forEach(el => {
      el.addEventListener("input", calculate);
    });
  </script>
</body>
</html>
